name: PHP Composer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # Keep in sync with config.platform.php in composer.json (matches production).
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        tools: composer:v2

    - name: Validate composer.json and composer.lock
      run: composer validate --no-check-all --strict

    - name: Get Composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - name: Cache Composer downloads
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Lint
      run: composer run-script lint

    - name: Install from config
      run: composer run-script quickstart

    # Disabled: the fixture is a Drupal 9 database, and Drupal 11 can only update
    # from 10.3 or later. Re-enable once the fixture is replaced with a fresh
    # sanitized snapshot of production.
    - name: Upgrade test
      if: false
      run: composer run-script upgrade-test
